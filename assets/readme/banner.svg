  <rect x="208" y="84" width="242" height="36" rx="18" fill="#93E1D8" stroke="#00774D" stroke-width="2.5"/>
  <text x="329" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#00774D" letter-spacing="1.6">OPEN SOURCE · PWA</text>

  <text x="72" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="66" font-weight="800" fill="#00774D" letter-spacing="-1.5">lets-talie</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" fill="#2F6B58">
    <text x="72" y="266">Log who paid for what.</text>
    <text x="72" y="296">lets-talie works out who owes whom.</text>
  </g>

  <g stroke="#00774D" stroke-width="2.5" fill="#FFFFFF">
    <rect x="72"  y="320" width="176" height="36" rx="18"/>
    <rect x="260" y="320" width="196" height="36" rx="18"/>
    <rect x="468" y="320" width="76"  height="36" rx="18"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#00774D" text-anchor="middle">
    <text x="160" y="344">Self-hostable</text>
    <text x="358" y="344">Installable PWA</text>
    <text x="506" y="344">MIT</text>
  </g>

  <!-- ── the app's balance screen ────────────────────────────────── -->
  <g id="balance-card">
    <rect x="660" y="44" width="468" height="312" rx="22" fill="#FFFFFF" stroke="#00774D" stroke-width="3"/>

    <text x="688" y="88" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#3F7A66" letter-spacing="1.5">YOUR BALANCE</text>
    <text x="688" y="152" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="54" font-weight="700" fill="#00774D">+$20.00</text>
    <text x="688" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" fill="#3F7A66">the group owes you</text>

    <path d="M688 212 H1100" stroke="#B9E5D8" stroke-width="2.5"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" fill="#0E3D30">
      <text x="688" y="260">Uber to the airport</text>
      <text x="688" y="318">Groceries</text>
    </g>
    <rect x="996" y="235" width="104" height="34" rx="10" fill="#93E1D8" stroke="#00774D" stroke-width="2.5"/>
    <rect x="996" y="293" width="104" height="34" rx="10" fill="#FFA69E" stroke="#752B24" stroke-width="2.5"/>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">
      <text x="1048" y="260" fill="#00774D">+20.00</text>
      <text x="1048" y="318" fill="#752B24">−14.50</text>
    </g>
  </g>
</svg>
