<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">lets-talie</title>
  <desc id="banner-desc">lets-talie — log who paid for what and it works out who owes whom. A self-hostable, installable PWA for shared expenses. Shown alongside the app's balance screen: a balance of plus 20.00, with recent entries for an Uber at plus 20.00 and groceries at minus 14.50.</desc>

  <rect x="1.5" y="1.5" width="1197" height="397" rx="26" fill="#DDFFF7" stroke="#00774D" stroke-width="3"/>

  <!-- ── identity ────────────────────────────────────────────────── -->
  <!-- The mark below is inlined from logo/logo.svg (minus its background
       rect). If the logo is re-exported from logo.af, re-copy those three
       shape groups here — `bun run assets:icons` does not touch this file. -->
  <rect x="72" y="44" width="116" height="116" rx="24" fill="#FFFFFF" stroke="#00774D" stroke-width="3"/>
  <svg x="82" y="54" width="96" height="96" viewBox="0 0 1000 1000">
